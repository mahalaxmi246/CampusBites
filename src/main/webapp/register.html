<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CampusBites</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">🍕 CampusBites</div>
        <nav>
            <a href="index.jsp">Home</a>
            <a href="menu.jsp">Menu</a>
            <a href="cart.jsp">🛒 Cart <span id="cart-count">0</span></a>
            <a href="Login.jsp">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <!-- REGISTER FORM -->
    <section class="auth-container">
        <div class="auth-card">
            <h2>Create Account 🍕</h2>
            <p class="auth-subtitle">Join CampusBites today!</p>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullname" placeholder="Enter your full name">
                <span class="error" id="fullname-error"></span>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="At least 5 characters">
                <span class="error" id="username-error"></span>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email">
                <span class="error" id="email-error"></span>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="At least 8 characters">
                <span class="error" id="password-error"></span>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Re-enter your password">
                <span class="error" id="confirm-error"></span>
            </div>

            <button class="auth-btn" onclick="validateRegister()">Register</button>

            <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 CampusBites | College Canteen System</p>
    </footer>

    <script src="js/cart.js"></script>
    <script>
        function validateRegister() {
            let valid = true;

            // Clear errors
            document.querySelectorAll('.error').forEach(e => e.textContent = '');

            const fullname = document.getElementById('fullname').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;

            // Full name
            if (fullname === '') {
                document.getElementById('fullname-error').textContent = 'Full name is required!';
                valid = false;
            }

            // Username
            if (username === '') {
                document.getElementById('username-error').textContent = 'Username is required!';
                valid = false;
            } else if (username.length < 5) {
                document.getElementById('username-error').textContent = 'Username must be at least 5 characters!';
                valid = false;
            }

            // Email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email === '') {
                document.getElementById('email-error').textContent = 'Email is required!';
                valid = false;
            } else if (!emailRegex.test(email)) {
                document.getElementById('email-error').textContent = 'Enter a valid email address!';
                valid = false;
            }

            // Password
            if (password === '') {
                document.getElementById('password-error').textContent = 'Password is required!';
                valid = false;
            } else if (password.length < 8) {
                document.getElementById('password-error').textContent = 'Password must be at least 8 characters!';
                valid = false;
            }

            // Confirm password
            if (confirm === '') {
                document.getElementById('confirm-error').textContent = 'Please confirm your password!';
                valid = false;
            } else if (confirm !== password) {
                document.getElementById('confirm-error').textContent = 'Passwords do not match!';
                valid = false;
            }

            if (valid) {
                // Send to RegisterServlet
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = 'RegisterServlet';

                const fields = { fullname, username, email, password };
                Object.entries(fields).forEach(([key, value]) => {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = key;
                    input.value = value;
                    form.appendChild(input);
                });

                document.body.appendChild(form);
                form.submit();
            }
        }
    </script>
</body>
</html>
